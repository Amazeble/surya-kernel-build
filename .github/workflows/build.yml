name: Build Surya Android 14 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Repository Files
        uses: actions/checkout@v4

      - name: Install Compiling Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev ccache bison flex libelf-dev clang lld python3 wget zip unzip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone Poco X3 NFC Kernel Source
        run: |
          DOMAIN="https://github.com"
          PATH_PART="/LineageOS/android_kernel_xiaomi_surya.git"
          git clone --depth=1 -b lineage-22.2 "${DOMAIN}${PATH_PART}" kernel-source

      - name: Integrate KernelSU Source Code
        run: |
          cd kernel-source
          DOMAIN="https://raw.githubusercontent.com"
          PATH_PART="/tiann/KernelSU/main/kernel/setup.sh"
          curl -LSs "${DOMAIN}${PATH_PART}" | bash -s main

      - name: Apply Your Custom Configuration Layout
        run: |
          if [ -f "$GITHUB_WORKSPACE/my_current_config" ]; then
            cp "$GITHUB_WORKSPACE/my_current_config" kernel-source/arch/arm64/configs/surya_defconfig
          else
            echo "Warning: my_current_config not found, using existing defconfig"
          fi

      - name: Fix Broken Device Tree Overlay
        run: |
          # Remove or disable the broken thermal overlay DTS file causing syntax errors
          OVERLAY_FILE="kernel-source/arch/arm64/boot/dts/qcom/sdmmagpie-thermal-overlay.dtsi"
          if [ -f "$OVERLAY_FILE" ]; then
            echo "Disabling broken sdmmagpie-thermal-overlay.dtsi..."
            rm -f "$OVERLAY_FILE"
          fi
          
          # Check for any Makefile references and disable them
          DTS_MAKEFILE="kernel-source/arch/arm64/boot/dts/qcom/Makefile"
          if [ -f "$DTS_MAKEFILE" ]; then
            echo "Removing references from Makefile..."
            sed -i 's/sdmmagpie-thermal-overlay\.dtbo/# sdmmagpie-thermal-overlay.dtbo/g' "$DTS_MAKEFILE"
            sed -i 's/sdmmagpie-thermal-overlay\.dtsi/# sdmmagpie-thermal-overlay.dtsi/g' "$DTS_MAKEFILE"
            sed -i '/sdmmagpie-thermal-overlay/d' "$DTS_MAKEFILE"
          fi
          
          # Also check if there's a Kconfig or dts-list file referencing it
          find kernel-source/arch/arm64/boot/dts -name "*.mk" -o -name "Makefile" -o -name "*.dts*" 2>/dev/null | while read file; do
            if grep -q "sdmmagpie-thermal-overlay" "$file" 2>/dev/null; then
              echo "Found reference in $file, removing..."
              sed -i '/sdmmagpie-thermal-overlay/d' "$file"
            fi
          done
          
          echo "Verification - checking if file still exists:"
          ls -la "$OVERLAY_FILE" 2>&1 || echo "File successfully removed"

      - name: Download Google / Proton Clang Toolchain
        run: |
          # Skip external clang download - use system clang from apt instead
          # External pre-built clang has glibc compatibility issues with ubuntu-latest
          echo "Using system clang toolchain"

      - name: Compile the Kernel Image
        run: |
          set -e
          cd kernel-source
          mkdir -p out
          echo "=== Starting kernel configuration ==="
          make ARCH=arm64 O=out surya_defconfig
          echo "=== Starting kernel compilation ==="
          
          # Run make and capture all output
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee ../build.log
          
          BUILD_STATUS=${PIPESTATUS[0]}
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "=== Kernel compilation FAILED with exit code $BUILD_STATUS ==="
            echo ""
            echo "=== FULL BUILD LOG (last 300 lines) ==="
            tail -n 300 ../build.log
            echo ""
            echo "=== Searching for specific error patterns ==="
            echo "--- Lines containing 'error:' ---"
            grep -i "error:" ../build.log | tail -100 || echo "No 'error:' patterns found"
            echo ""
            echo "--- Lines containing 'fatal:' ---"
            grep -i "fatal" ../build.log | tail -50 || echo "No 'fatal' patterns found"
            echo ""
            echo "--- Last command before failure ---"
            tail -n 50 ../build.log | head -n 20
            exit 1
          fi
          
          echo "=== Kernel compilation completed successfully ==="
          ls -lh out/arch/arm64/boot/

      - name: Package with AnyKernel3
        run: |
          set -e
          DOMAIN="https://github.com"
          PATH_PART="/osm0sis/AnyKernel3.git"
          git clone --depth=1 "${DOMAIN}${PATH_PART}"
          
          echo "=== Checking for kernel image files ==="
          ls -lh kernel-source/out/arch/arm64/boot/ || true
          
          # Check what files actually exist
          KERNEL_IMAGE=""
          if [ -f kernel-source/out/arch/arm64/boot/Image.gz-dtb ]; then
            KERNEL_IMAGE="Image.gz-dtb"
          elif [ -f kernel-source/out/arch/arm64/boot/Image.gz ]; then
            KERNEL_IMAGE="Image.gz"
          elif [ -f kernel-source/out/arch/arm64/boot/Image ]; then
            KERNEL_IMAGE="Image"
          fi
          
          if [ -z "$KERNEL_IMAGE" ]; then
            echo "ERROR: No kernel image found!"
            echo ""
            echo "Searching entire output directory:"
            find kernel-source/out -type f -name "*Image*" 2>/dev/null || echo "No Image files found"
            echo ""
            echo "Directory structure:"
            ls -laR kernel-source/out/arch/arm64/boot/ 2>/dev/null || echo "boot directory doesn't exist"
            exit 1
          fi
          
          echo "Found $KERNEL_IMAGE, copying to AnyKernel3..."
          cp "kernel-source/out/arch/arm64/boot/$KERNEL_IMAGE" AnyKernel3/
          cd AnyKernel3
          zip -r9 ../surya-custom-kernel.zip *

      - name: Upload Finished Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Surya-Custom-Kernel-Package
          path: surya-custom-kernel.zip
