name: Build SukiSU-Ultra + SUSFS Kernel

on:
  workflow_dispatch:

jobs:
  build:
    # Force Ubuntu 22.04 to avoid the broken 24.04 apt package bugs in third-party actions
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Amazeble/android_kernel_xiaomi_surya
          ref: "16.0"
          path: kernel-source

      - name: Inject SukiSU-Ultra and SUSFS
        run: |
          cd kernel-source
          
          # Apply official SukiSU-Ultra SUSFS patch
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
          
          # Ensure SUSFS and KPM are enabled in the defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/surya_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/surya_defconfig
          echo "CONFIG_KPM=y" >> arch/arm64/configs/surya_defconfig

      - name: Setup Toolchains
        run: |
          # Download Proton-Clang
          echo "Downloading Proton-Clang..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/proton-clang
          
          # Download GCC fallbacks required by 4.14 kernels
          echo "Downloading GCC Toolchains..."
          git clone --depth=1 https://github.com/arter97/arm64-gcc.git $HOME/gcc-64
          git clone --depth=1 https://github.com/arter97/arm-gcc.git $HOME/gcc-32
          
          # Add to PATH
          echo "$HOME/proton-clang/bin" >> $GITHUB_PATH
          echo "$HOME/gcc-64/bin" >> $GITHUB_PATH
          echo "$HOME/gcc-32/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          cd kernel-source
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          
          # Make output directory
          mkdir -p out
          
          # Generate config
          make O=out surya_defconfig
          
          # Compile Kernel
          make -j$(nproc --all) O=out \
            CC=clang \
            HOSTCC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            STRIP=llvm-strip \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            OBJSIZE=llvm-size \
            READELF=llvm-readelf

      - name: Package AnyKernel3 Zip
        run: |
          # Clone a generic AnyKernel3 template
          git clone https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          
          # Copy the compiled kernel image to AnyKernel3
          cp ../kernel-source/out/arch/arm64/boot/Image.gz .
          
          # Zip it up
          zip -r9 SukiSU-SUSFS-Surya.zip *
          
          # Move to workspace root for upload
          mv SukiSU-SUSFS-Surya.zip $GITHUB_WORKSPACE/

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Surya-A14-SukiSU-SUSFS
          path: ${{ github.workspace }}/SukiSU-SUSFS-Surya.zip
