name: Build SukiSU-Ultra + SUSFS Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Amazeble/android_kernel_xiaomi_surya
          ref: "16.0"
          path: kernel-source

      - name: Inject SukiSU-Ultra and SUSFS
        run: |
          cd kernel-source
          
          # Apply official SukiSU-Ultra SUSFS patch
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
          
          # Ensure SUSFS and KPM are enabled in the defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/surya_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/surya_defconfig
          echo "CONFIG_KPM=y" >> arch/arm64/configs/surya_defconfig

      - name: Build Kernel with AnyKernel3
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: ./kernel-source/
          config: surya_defconfig
          arch: arm64
          android-version: "14"
          aosp-clang: false
          aosp-gcc: false
          other-clang-url: https://github.com/kdrag0n/proton-clang
          other-clang-branch: master
          other-gcc64-url: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9
          other-gcc64-branch: lineage-21.0
          other-gcc32-url: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9
          other-gcc32-branch: lineage-21.0
          anykernel3: true
