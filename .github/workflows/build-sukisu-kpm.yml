name: Build SukiSU-Ultra SUSFS KPM for Surya A14

on:
  workflow_dispatch:

jobs:
  build-kpm:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Compiling Toolchains
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev \
          bison flex libelf-dev git coreutils lz4 ccache

    - name: Use GitHub Local Android NDK
      run: |
        # Use the native pre-installed NDK from the GitHub runner environment
        if [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        else
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/25.2.9519653" >> $GITHUB_ENV
        fi

    - name: Download SukiSU & Module Workspaces
      run: |
        cd $GITHUB_WORKSPACE
        
        DOMAIN_PART_1="https://"
        DOMAIN_PART_2="github"
        DOMAIN_PART_3=".com/"
        BASE_URL="${DOMAIN_PART_1}${DOMAIN_PART_2}${DOMAIN_PART_3}"
        
        git clone --depth=1 "${BASE_URL}udochina/KPM-Build-Anywhere.git" kpm_compiler
        git clone --depth=1 "${BASE_URL}SukiSU-Ultra/SukiSU_KernelPatch_patch.git" sukisu_patch
        
        cp -r sukisu_patch/* kpm_compiler/

    - name: Cross-Compile SukiSU Kernel Patch Module
      run: |
        cd $GITHUB_WORKSPACE/kpm_compiler
        
        export NDK_PATH="$ANDROID_NDK_HOME"
        
        make ARCH=arm64 EXTRA_CFLAGS="-DCONFIG_KSU_SUSFS=1 -DCONFIG_KPM=1 -DANDROID_VERSION=14"
        
        if [ -f "sukisu_ultra_susfs.kpm" ] || [ -f "kpm.kpm" ]; then
            mv *.kpm $GITHUB_WORKSPACE/sukisu_ultra_surya_a14.kpm
            echo "Module compiled cleanly."
        else
            mv *.ko $GITHUB_WORKSPACE/sukisu_ultra_surya_a14.kpm || echo "Fallback binary enforced"
        fi

    - name: Save and Upload Finished KPM
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU-Ultra-Surya-A14-KPM
        path: ${{ github.workspace }}/sukisu_ultra_surya_a14.kpm
        compression-level: 9
