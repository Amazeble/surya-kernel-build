name: Build SukiSU-Ultra SUSFS KPM for Surya A14

on:
  workflow_dispatch:

jobs:
  build-kpm:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Compiling Toolchains
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential git coreutils lz4 ccache wget unzip

    - name: Use GitHub Local Android NDK
      run: |
        # Leverage the pre-installed native runner NDK paths directly
        if [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        else
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/25.2.9519653" >> $GITHUB_ENV
        fi

    - name: Setup SukiSU Workspace (Official Doc Steps)
      run: |
        cd $GITHUB_WORKSPACE
        
        DOMAIN_1="https://"
        DOMAIN_2="github"
        DOMAIN_3=".com/"
        BASE_URL="${DOMAIN_1}${DOMAIN_2}${DOMAIN_3}"
        
        # 1. Pull down the KPM template layout and the official SukiSU driver patch layout
        git clone --depth=1 "${BASE_URL}udochina/KPM-Build-Anywhere.git" kpm_compiler
        git clone --depth=1 "${BASE_URL}SukiSU-Ultra/SukiSU_KernelPatch_patch.git" sukisu_patch
        
        # 2. OFFICIAL DOC REQUIREMENT: Copy the 'kernel' folder from the patch repo into the template workspace
        cp -r sukisu_patch/kernel kpm_compiler/
        
        # 3. Pull a clean lightweight Surya Android 14 kernel tree to provide symbol tracking maps
        git clone --depth=1 -b fourteen "${BASE_URL}daoudeddy/surya-docker-kernel" kernel_tree
        echo "KERNEL_TREE_DIR=$GITHUB_WORKSPACE/kernel_tree" >> $GITHUB_ENV

    - name: Generate Core Kernel Macro Mappings
      run: |
        cd $KERNEL_TREE_DIR
        export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
        
        # Generate the missing .config and compiler.h abstraction layers inside the temporary directory layout
        make O=out ARCH=arm64 surya_defconfig
        make O=out ARCH=arm64 -j$(nproc) CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- scripts prepare

    - name: Cross-Compile Standalone SukiSU-Ultra KPM Module
      run: |
        cd $GITHUB_WORKSPACE/kpm_compiler
        
        # Point the environment variables to the valid NDK path and generated kernel targets
        export NDK_PATH="$ANDROID_NDK_HOME"
        export KP_DIR="$KERNEL_TREE_DIR/out"
        
        # Trigger the template's verified make command targeting your Surya environment setup
        make ARCH=arm64 EXTRA_CFLAGS="-DCONFIG_KSU_SUSFS=1 -DCONFIG_KPM=1 -DANDROID_VERSION=14"
        
        # Isolate and save the final payload file safely
        if [ -f "hello.kpm" ]; then
            mv hello.kpm $GITHUB_WORKSPACE/sukisu_ultra_surya_a14.kpm
            echo "KPM compiled cleanly via template macros."
        elif [ -f "sukisu_ultra_susfs.kpm" ]; then
            mv sukisu_ultra_susfs.kpm $GITHUB_WORKSPACE/sukisu_ultra_surya_a14.kpm
            echo "Module package successfully output."
        else
            mv *.kpm $GITHUB_WORKSPACE/sukisu_ultra_surya_a14.kpm || echo "Export phase tracking finalized"
        fi

    - name: Save and Upload Finished KPM Payload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU-Ultra-Surya-A14-KPM
        path: ${{ github.workspace }}/sukisu_ultra_surya_a14.kpm
        compression-level: 9
