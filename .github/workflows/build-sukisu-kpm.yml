name: Build SukiSU-Ultra SUSFS KPM for Surya A14

on:
  workflow_dispatch:

jobs:
  build-kpm:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Empty Repository
      uses: actions/checkout@v4

    - name: Install System Compiling Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential git coreutils lz4 ccache wget unzip

    - name: Use GitHub Local Android NDK
      run: |
        # Target the native pre-installed NDK environment included on the runner
        if [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        else
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/25.2.9519653" >> $GITHUB_ENV
        fi

    - name: Download and Merge SukiSU into Native Framework
      run: |
        cd $GITHUB_WORKSPACE
        
        DOMAIN_1="https://"
        DOMAIN_2="github"
        DOMAIN_3=".com/"
        BASE_URL="${DOMAIN_1}${DOMAIN_2}${DOMAIN_3}"
        
        # 1. Clone the parent KernelPatch workspace and the SukiSU custom driver source overrides
        git clone --depth=1 "${BASE_URL}bmax121/KernelPatch.git" kp_workspace
        git clone --depth=1 "${BASE_URL}SukiSU-Ultra/SukiSU_KernelPatch_patch.git" sukisu_patch
        
        # 2. SukiSU-Ultra replaces the internal files found inside the native 'kpm/' development folder
        # We wipe the placeholder 'hello.c' to prevent conflicting symbol outputs
        rm -f kp_workspace/kpm/hello.c
        cp -r sukisu_patch/* kp_workspace/kpm/
        
        # 3. Completely rewrite KernelPatch's Kbuild file to link the multi-object files (main, su, hook)
        cat > kp_workspace/kpm/Kbuild << 'EOF'
        obj-m += kpm.o
        kpm-y := main.o su.o hook.o
        EOF

    - name: Cross-Compile Standalone SukiSU-Ultra KPM Module
      run: |
        cd $GITHUB_WORKSPACE/kp_workspace
        
        export NDK_PATH="$ANDROID_NDK_HOME"
        
        # Execute KernelPatch's native module compiler target rule
        # This dynamically auto-generates 'kpmodule.h' and correctly compiles the KPM
        make kpm EXTRA_CFLAGS="-DCONFIG_KSU_SUSFS=1 -DCONFIG_KPM=1 -DANDROID_VERSION=14"
        
        # Find the compiled KPM package inside the native output directory
        if [ -f "out/kpm.kpm" ]; then
            mv out/kpm.kpm $GITHUB_WORKSPACE/sukisu_ultra_surya_a14.kpm
            echo "KPM compiled cleanly via native parameters."
        else
            # Comprehensive fallback find if the target output properties shift
            find out/ -name "*.kpm" -exec mv {} $GITHUB_WORKSPACE/sukisu_ultra_surya_a14.kpm \; || \
            find out/ -name "*.ko" -exec mv {} $GITHUB_WORKSPACE/sukisu_ultra_surya_a14.kpm \; || \
            (echo "::error::KPM compilation target binary output is missing!" && exit 1)
        fi

    - name: Upload Flashable KPM Payload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU-Ultra-Surya-A14-KPM
        path: ${{ github.workspace }}/sukisu_ultra_surya_a14.kpm
        compression-level: 9
