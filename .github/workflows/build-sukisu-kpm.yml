name: Build SukiSU-Ultra SUSFS KPM

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Your 4.14 Kernel Git Repository URL'
        required: true
        default: 'https://github.com'
      kernel_branch:
        description: 'Kernel Branch'
        required: true
        default: 'lineage-21'
      defconfig_name:
        description: 'Your Device Defconfig Name (e.g., vince_defconfig)'
        required: true
        default: 'vince_defconfig'

jobs:
  build-kpm:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Build Workspace
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev \
          bison flex libelf-dev git coreutils lz4 ccache

    - name: Setup Android NDK
      id: setup-ndk
      uses: android-actions/setup-ndk@v3
      with:
        ndk-version: r26b

    - name: Clone Target 4.14 Kernel Source
      run: |
        git clone --depth=1 -b ${{ github.event.inputs.kernel_branch }} ${{ github.event.inputs.kernel_repo }} kernel_workspace
        echo "KERNEL_SRC=$GITHUB_WORKSPACE/kernel_workspace" >> $GITHUB_ENV

    - name: Inject KPM & SUSFS Configuration Symbols
      run: |
        cd $KERNEL_SRC
        
        # Inject the core KPM driver layer menu entry into Kconfig
        echo "Injecting KPM flag configuration hooks..."
        cat >> kernel/Kconfig << 'EOF'
        config KPM
        	bool "Kernel Patch Module support"
        	default y
        	help
        	  Enable support for Kernel Patch Modules.
        	  Required for SukiSU-Ultra KPM functionality.
        EOF
        
        # Append target build configurations directly into target defconfig file
        DEFCONFIG_PATH="arch/arm64/configs/${{ github.event.inputs.defconfig_name }}"
        if [ -f "$DEFCONFIG_PATH" ]; then
            echo "CONFIG_KPM=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KALLSYMS=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KALLSYMS_ALL=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG_PATH"
            echo "Successfully modified $DEFCONFIG_PATH"
        else
            echo "::error::Defconfig path ($DEFCONFIG_PATH) not found!"
            exit 1
        fi

    - name: Fetch SukiSU-Ultra & Compiler Ecosystem
      run: |
        cd $GITHUB_WORKSPACE
        git clone --depth=1 https://github.com kpm_compiler
        git clone --depth=1 https://github.com sukisu_patch
        
        # Overwrite building templates with SukiSU-Ultra optimized configurations
        cp -r sukisu_patch/* kpm_compiler/

    - name: Cross-Compile KPM Driver Package
      run: |
        cd $GITHUB_WORKSPACE/kpm_compiler
        
        # Export toolchain flags for workspace compiler path evaluation
        export NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
        export KP_DIR="$KERNEL_SRC"
        
        # Run cross-compiler
        make ARCH=arm64
        
        # Verify binary creation and rename for easy parsing
        if [ -f "sukisu_ultra_susfs.kpm" ] || [ -f "kpm.kpm" ]; then
            mv *.kpm $GITHUB_WORKSPACE/sukisu_ultra_susfs.kpm
            echo "Compilation completed cleanly."
        else
            # Fallback check depending on repository internal naming structure
            mv *.ko $GITHUB_WORKSPACE/sukisu_ultra_susfs.kpm || echo "No ko fallback found"
        fi

    - name: Upload Compiled KPM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU-Ultra-SUSFS-KPM
        path: ${{ github.workspace }}/sukisu_ultra_susfs.kpm
        compression-level: 9
