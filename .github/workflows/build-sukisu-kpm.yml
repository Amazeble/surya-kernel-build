name: Build SukiSU-Ultra KPM for Surya A14

on:
  workflow_dispatch:

jobs:
  build-kpm:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup NDK Environment
      run: |
        # GitHub Actions runners have NDK pre-installed
        if [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        else
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/25.2.9519653" >> $GITHUB_ENV
        fi

    - name: Setup SukiSU KPM Workspace
      run: |
        cd $GITHUB_WORKSPACE
        
        # Clone the KPM build template
        git clone --depth=1 https://github.com/udochina/KPM-Build-Anywhere.git kpm_compiler
        
        # Clone the official SukiSU KernelPatch patch repository
        git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch.git sukisu_patch
        
        # Copy the 'kernel' folder from the patch repo into the template workspace
        # This provides the required headers (linux/include, etc.) for KPM compilation
        cp -r sukisu_patch/kernel kpm_compiler/

    - name: Cross-Compile KPM Module
      run: |
        cd $GITHUB_WORKSPACE/kpm_compiler
        
        # Set required environment variables for the Makefile
        export NDK_PATH="$ANDROID_NDK_HOME"
        export KP_DIR="."  # Points to current directory where 'kernel' folder now exists
        
        # Run make. The template will compile hello.c into hello.kpm
        make
        
        # Move the compiled KPM to workspace root
        if [ -f "hello.kpm" ]; then
            mv hello.kpm $GITHUB_WORKSPACE/sukisu_ultra_surya_a14.kpm
            echo "✅ KPM compiled successfully."
        else
            echo "❌ Compilation failed. No .kpm file produced."
            exit 1
        fi

    - name: Upload KPM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU-Ultra-Surya-A14-KPM
        path: ${{ github.workspace }}/sukisu_ultra_surya_a14.kpm
        compression-level: 9
